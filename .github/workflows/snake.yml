name: generate-snake-animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23CBA6F7&color_dots=%231E1E2E,%23313244,%2389B4FA,%23A6E3A1,%23CBA6F7
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F38BA8&color_dots=%2311111B,%23313244,%2389B4FA,%23A6E3A1,%23CBA6F7

      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
